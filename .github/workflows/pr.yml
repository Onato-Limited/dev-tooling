name: pr
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, dismissed]
permissions: {}
jobs:
  policy:
    uses: ./.github/workflows/pr-policy.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
    with:
      approver: onato
