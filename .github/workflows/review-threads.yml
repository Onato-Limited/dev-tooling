name: review-threads
on:
  workflow_call:
permissions: {}
jobs:
  threads:
    runs-on: ubuntu-latest
    # No concurrency group: a review fires an event per inline comment at once, and a cancelled
    # run blocks branch protection until it is re-run. Each run reads the threads live; only one
    # that read just before a resolve reports stale, and the next review event's run corrects it.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The CLI comes from the same commit as this workflow, so a caller pinned at @v2 never runs
      # a different version of the check than the workflow it called.
      - name: Find this workflow's commit
        env:
          REPOSITORY: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
        run: |
          echo "devtool from $REPOSITORY@$SHA"
          test -n "$REPOSITORY" && test -n "$SHA"
      - name: Check out devtool at this workflow's commit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devtool
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Check the PR's review threads
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: >
          uv run --quiet --frozen --no-dev --project .devtool devtool review-threads
          --repo "$GITHUB_REPOSITORY" --pr "$PR"
