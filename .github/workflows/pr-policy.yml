name: pr-policy
on:
  workflow_call:
    inputs:
      limit:
        description: Most changed lines a PR may have, after `.github/pr-size-exclude`
        type: number
        default: 400
      approver:
        description: The only login whose approving review passes an oversized PR
        type: string
        default: ""
      protected-paths:
        description: Gitignore-style patterns, one per line, for files no PR may change
        type: string
        default: ""
      concurrency-pattern:
        description: A regex; added lines matching it need a `## Concurrency notes` section
        type: string
        default: ""
      concurrency-paths:
        description: Gitignore-style patterns, one per line, limiting where the pattern applies
        type: string
        default: ""
permissions: {}
jobs:
  size:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI comes from the same commit as this workflow, so a caller pinned at @v1 never runs
      # a different version of the checks than the workflow it called. An empty repository would
      # make checkout fall back to the caller's repo, so refuse that.
      - name: Find this workflow's commit
        env:
          REPOSITORY: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
        run: |
          echo "devtool from $REPOSITORY@$SHA"
          test -n "$REPOSITORY" && test -n "$SHA"
      - name: Check out devtool at this workflow's commit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devtool
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Read the PR's reviews
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: >
          gh api --paginate "repos/$REPO/pulls/$PR/reviews" --jq '.[]'
          | jq -s . > "$RUNNER_TEMP/reviews.json"
      - name: Count changed lines
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          LIMIT: ${{ inputs.limit }}
          APPROVER: ${{ inputs.approver }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: >
          git diff --numstat "origin/$BASE_REF...HEAD"
          | uv run --quiet --frozen --no-dev --project .devtool devtool pr-size
          --limit "$LIMIT" --reviews "$RUNNER_TEMP/reviews.json" --author "$AUTHOR"
          ${APPROVER:+--approver "$APPROVER"}
  protected-paths:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find this workflow's commit
        env:
          REPOSITORY: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
        run: |
          echo "devtool from $REPOSITORY@$SHA"
          test -n "$REPOSITORY" && test -n "$SHA"
      - name: Check out devtool at this workflow's commit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devtool
      - uses: astral-sh/setup-uv@v10.3.3
      # --no-renames lists a moved file's old path too, so moving a file out of a protected
      # path counts as changing it.
      - name: Check protected paths
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PATTERNS: ${{ inputs.protected-paths }}
        run: >
          git diff --name-only --no-renames "origin/$BASE_REF...HEAD"
          | uv run --quiet --frozen --no-dev --project .devtool devtool protected-paths
          --patterns "$PATTERNS"
  codeowners:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find this workflow's commit
        env:
          REPOSITORY: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
        run: |
          echo "devtool from $REPOSITORY@$SHA"
          test -n "$REPOSITORY" && test -n "$SHA"
      - name: Check out devtool at this workflow's commit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devtool
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Read the PR's reviews
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: >
          gh api --paginate "repos/$REPO/pulls/$PR/reviews" --jq '.[]'
          | jq -s . > "$RUNNER_TEMP/reviews.json"
      # From the base branch, so a PR can't drop its own owners. GitHub reads the first of these.
      - name: Read CODEOWNERS from the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          for path in .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS; do
            if git show "origin/$BASE_REF:$path" > "$RUNNER_TEMP/CODEOWNERS" 2>/dev/null; then
              echo "CODEOWNERS from $path on $BASE_REF"
              exit 0
            fi
          done
          rm -f "$RUNNER_TEMP/CODEOWNERS"
      # --no-renames lists a moved file's old path too, so moving an owned file counts.
      - name: Check code owners' approvals
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: >
          git diff --name-only --no-renames "origin/$BASE_REF...HEAD"
          | uv run --quiet --frozen --no-dev --project .devtool devtool codeowners
          --codeowners "$RUNNER_TEMP/CODEOWNERS" --reviews "$RUNNER_TEMP/reviews.json"
          --author "$AUTHOR"
  required-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Find this workflow's commit
        env:
          REPOSITORY: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
        run: |
          echo "devtool from $REPOSITORY@$SHA"
          test -n "$REPOSITORY" && test -n "$SHA"
      - name: Check out devtool at this workflow's commit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devtool
      - uses: astral-sh/setup-uv@v10.3.3
      # The token fetches workflows the caller's jobs call from other repos, to read their job
      # names. It reaches public repos and the caller's own.
      - name: Check .github/required-checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --quiet --frozen --no-dev --project .devtool devtool required-checks
  pr-shape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find this workflow's commit
        env:
          REPOSITORY: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
        run: |
          echo "devtool from $REPOSITORY@$SHA"
          test -n "$REPOSITORY" && test -n "$SHA"
      - name: Check out devtool at this workflow's commit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devtool
      - uses: astral-sh/setup-uv@v10.3.3
      # The title and body are text anyone opening a PR controls: they reach the shell only
      # through env, never by ${{ }} substitution into the script.
      - name: Check the PR's title, body and diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          PATTERN: ${{ inputs.concurrency-pattern }}
          PATHS: ${{ inputs.concurrency-paths }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          git diff -U0 "origin/$BASE_REF...HEAD" \
            | uv run --quiet --frozen --no-dev --project .devtool devtool pr-shape \
              --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" \
              --concurrency-pattern "$PATTERN" --concurrency-paths "$PATHS"
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find this workflow's commit
        env:
          REPOSITORY: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
        run: |
          echo "devtool from $REPOSITORY@$SHA"
          test -n "$REPOSITORY" && test -n "$SHA"
      - name: Check out devtool at this workflow's commit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devtool
      - uses: astral-sh/setup-uv@v10.3.3
      # The gitleaks CLI (MIT), not gitleaks-action, which needs a licence key for organization
      # repos. The release is pinned by checksum, so a replaced download fails here.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      # Exit code 2 means leaks were found; any other failure is gitleaks itself failing to run.
      - name: Scan the PR's commits
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          report="$RUNNER_TEMP/gitleaks.json"
          status=0
          "$RUNNER_TEMP/gitleaks" git --log-opts="origin/$BASE_REF..HEAD" --redact --no-banner \
            --exit-code 2 --report-format json --report-path "$report" || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "gitleaks failed to run (exit $status)"
            exit "$status"
          fi
          uv run --quiet --frozen --no-dev --project .devtool devtool secrets-report --report "$report"
