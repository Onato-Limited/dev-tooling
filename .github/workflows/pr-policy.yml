name: pr-policy
on:
  workflow_call:
    inputs:
      limit:
        description: Most changed lines a PR may have, after `.github/pr-size-exclude`
        type: number
        default: 400
      approver:
        description: The only login whose `size-approved` label lets an oversized PR pass
        type: string
        default: ""
      protected-paths:
        description: Gitignore-style patterns, one per line, for files no PR may change
        type: string
        default: ""
      concurrency-pattern:
        description: A regex; added lines matching it need a `## Concurrency notes` section
        type: string
        default: ""
      concurrency-paths:
        description: Gitignore-style patterns, one per line, limiting where the pattern applies
        type: string
        default: ""
permissions: {}
jobs:
  size:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI comes from the same commit as this workflow, so a caller pinned at @v1 never runs
      # a different version of the checks than the workflow it called. An empty repository would
      # make checkout fall back to the caller's repo, so refuse that.
      - name: Find this workflow's commit
        env:
          REPOSITORY: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
        run: |
          echo "devtool from $REPOSITORY@$SHA"
          test -n "$REPOSITORY" && test -n "$SHA"
      - name: Check out devtool at this workflow's commit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devtool
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Read the PR's label events
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
        run: >
          gh api --paginate "repos/$REPO/issues/$PR/events" --jq '.[]'
          | jq -s . > "$RUNNER_TEMP/label-events.json"
      - name: Count changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
          LIMIT: ${{ inputs.limit }}
          APPROVER: ${{ inputs.approver }}
        run: >
          git diff --numstat "origin/$BASE_REF...HEAD"
          | uv run --quiet --frozen --no-dev --project .devtool devtool pr-size
          --limit "$LIMIT" --label-events "$RUNNER_TEMP/label-events.json"
          ${APPROVER:+--approver "$APPROVER"}
  protected-paths:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find this workflow's commit
        env:
          REPOSITORY: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
        run: |
          echo "devtool from $REPOSITORY@$SHA"
          test -n "$REPOSITORY" && test -n "$SHA"
      - name: Check out devtool at this workflow's commit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devtool
      - uses: astral-sh/setup-uv@v10.3.3
      # --no-renames lists a moved file's old path too, so moving a file out of a protected
      # path counts as changing it.
      - name: Check protected paths
        env:
          BASE_REF: ${{ github.base_ref }}
          PATTERNS: ${{ inputs.protected-paths }}
        run: >
          git diff --name-only --no-renames "origin/$BASE_REF...HEAD"
          | uv run --quiet --frozen --no-dev --project .devtool devtool protected-paths
          --patterns "$PATTERNS"
  required-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Find this workflow's commit
        env:
          REPOSITORY: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
        run: |
          echo "devtool from $REPOSITORY@$SHA"
          test -n "$REPOSITORY" && test -n "$SHA"
      - name: Check out devtool at this workflow's commit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devtool
      - uses: astral-sh/setup-uv@v10.3.3
      # The token fetches workflows the caller's jobs call from other repos, to read their job
      # names. It reaches public repos and the caller's own.
      - name: Check .github/required-checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --quiet --frozen --no-dev --project .devtool devtool required-checks
  pr-shape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find this workflow's commit
        env:
          REPOSITORY: ${{ job.workflow_repository }}
          SHA: ${{ job.workflow_sha }}
        run: |
          echo "devtool from $REPOSITORY@$SHA"
          test -n "$REPOSITORY" && test -n "$SHA"
      - name: Check out devtool at this workflow's commit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devtool
      - uses: astral-sh/setup-uv@v10.3.3
      # The title and body are text anyone opening a PR controls: they reach the shell only
      # through env, never by ${{ }} substitution into the script.
      - name: Check the PR's title, body and diff
        env:
          BASE_REF: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          PATTERN: ${{ inputs.concurrency-pattern }}
          PATHS: ${{ inputs.concurrency-paths }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          git diff -U0 "origin/$BASE_REF...HEAD" \
            | uv run --quiet --frozen --no-dev --project .devtool devtool pr-shape \
              --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" \
              --concurrency-pattern "$PATTERN" --concurrency-paths "$PATHS"
