name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A merge that leaves the version unchanged releases nothing; bump it in pyproject.toml.
      - name: Tag a new version
        id: tag
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already exists; nothing to tag"
            exit 0
          fi
          major="v${version%%.*}"
          git tag "v$version"
          git tag -f "$major"
          git push origin "refs/tags/v$version"
          git push -f origin "refs/tags/$major"
      # Separate from tagging, so a re-run creates a release whose tag was pushed but whose
      # release failed. Notes run from the previous release; the moving major tag has none.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            exit 0
          fi
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag --latest
