[project]
name = "devtool"
version = "1.6.1"
description = "Shared CI policy checks, PR review and Ralph loop tooling"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.4",
]

[project.scripts]
devtool = "devtool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["devtool"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
